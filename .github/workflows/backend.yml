name: backend

on:
  push:
    paths:
      - "backend/**"
      - "Makefile"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "Makefile"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q
